<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#000}
#home{position:fixed;inset:0;background:url('door-open.jpg') center/cover}
#openBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:50%;border:none;background:gold;font-weight:bold;font-size:18px;z-index:9999;cursor:pointer}
</style>
</head>
<body>
<audio id="bgm" src="sample.mp3" loop playsinline preload="auto"></audio>
<div id="home">
<button id="openBtn" type="button">OPEN</button>
<video id="doorVideo" style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1" muted playsinline preload="auto" poster="door-open.jpg">
<source src="door-open.mp4" type="video/mp4">
</video>
</div>

<script>
const btn = document.getElementById('openBtn');
const bgm = document.getElementById('bgm');
const vid = document.getElementById('doorVideo');
bgm.volume = 0.8;

btn.addEventListener('click', function() {
  // THIS MUST BE FIRST LINE IN CLICK FOR SAFARI
  bgm.muted = false;
  var p1 = bgm.play();
  if(p1) p1.catch(function(){});
  
  btn.style.display='none';
  
  vid.muted = false;
  var p2 = vid.play();
  if(p2) p2.catch(function(){
    vid.muted = true;
    vid.play();
  });
}, {once:true});
</script>
</body>
</html>
