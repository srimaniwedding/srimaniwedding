<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Test Final</title>
<style>
body{margin:0;background:#000;overflow:hidden}
#doorVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#openBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2147483647;width:120px;height:120px;border-radius:50%;border:3px solid #fff;background:gold;font:bold 18px Arial;color:#000;cursor:pointer}
</style>
</head>
<body>
<audio id="bgm" src="sample.mp3" playsinline preload="auto"></audio>
<video id="doorVideo" muted playsinline poster="door-open.jpg"><source src="door-open.mp4" type="video/mp4"></video>
<button id="openBtn" type="button" onclick="openDoor()">OPEN</button>

<script>
var bgm = document.getElementById('bgm');
var doorVideo = document.getElementById('doorVideo');
var opened = false;

function openDoor(){
  if(opened) return;
  opened = true;
  console.log('OPEN CLICKED');
  bgm.muted = false;
  bgm.volume = 1;
  bgm.currentTime = 0;
  bgm.play().then(()=>{console.log('audio ok')}).catch(e=>{console.log('audio fail',e); alert('Tap volume up + silent off')});
  
  document.getElementById('openBtn').style.display='none';
  
  doorVideo.muted = true;
  doorVideo.currentTime = 0;
  doorVideo.play().catch(()=>{});

  // after 4 sec go to your welcome video - change this to your logic later
  setTimeout(function(){
    window.location.href = '#event'; // placeholder - we will add welcome stage after this works
  }, 4000);
}

// also add listeners as backup
document.getElementById('openBtn').addEventListener('touchend', function(e){ e.preventDefault(); openDoor(); }, {passive:false});
</script>
</body>
</html>
