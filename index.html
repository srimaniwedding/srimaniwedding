<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Srimani Wedding - 11th Nov 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#800000">
<meta property="og:image" content="https://srimaniwedding.vercel.app/cover-v3.jpg?v=2">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#FFFAF0 url('wallpaper.jpg') repeat;background-size:380px auto;font-family:Arial,sans-serif;overflow:hidden}
body{min-height:100dvh}
#openBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2147483647;width:115px;height:115px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 30% 30%,#ffefb0,#f5c542 40%,#b8912a 100%);font-weight:bold;color:#5a4210;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#home{position:fixed;inset:0;z-index:30;background:#3a2a1a url('door-open.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center}
#doorVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#welcomeStage{position:fixed;inset:0;background:#000;z-index:20;display:none;opacity:0;transition:opacity .6s}
#welcomeStage.show{display:block;opacity:1}
#welcomeStage.fadeOut{opacity:0}
#welcomeCrop{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden}
#welcomeCrop video{position:absolute;inset:0;width:100vw;height:100dvh;object-fit:cover}
#eventPage{position:fixed;inset:0;width:100%;height:100dvh;overflow-y:auto;display:none;opacity:0;transition:opacity .6s;z-index:10;-webkit-overflow-scrolling:touch;scroll-snap-type:y mandatory;scroll-behavior:smooth}
#eventPage.show{display:block}
#eventPage.visible{opacity:1}
.snap-section{min-height:100dvh;display:flex;align-items:center;justify-content:center;scroll-snap-align:start;padding:10px 12px}
.video-box{max-width:min(460px,90vw);margin:0 auto 28px;width:100%}
.video-box video{width:100%;border-radius:12px;display:block}
#video-wrapper{position:relative;width:100%;max-width:520px;margin:0 auto;padding:0 20px 16px}
.petals{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.petal{position:absolute;top:-20px;font-size:18px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
.floral-side{position:fixed;top:0;width:22px;height:100vh;background:url('floral-border.png') repeat-y;background-size:contain;z-index:90;pointer-events:none}
.floral-left{left:0}.floral-right{right:0}
#sparkCanvas{position:fixed;inset:0;pointer-events:none;z-index:200}
#scratchHint{transition:opacity .4s}
#scratchHint.hide{opacity:0}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
</style>
</head>
<body>
<audio id="bgm" src="sample.mp3" playsinline preload="auto"></audio>
<button id="openBtn" type="button" onclick="openDoor()">OPEN</button>
<button id="muteBtn" style="position:fixed;top:10px;right:10px;z-index:999;width:36px;height:36px;border-radius:50%;border:1px solid #D4AF37;background:rgba(0,0,0,.5);color:#D4AF37;cursor:pointer;display:none">🔊</button>

<div id="home"><video id="doorVideo" muted playsinline preload="auto" poster="door-open.jpg"><source src="door-open.webm" type="video/webm"><source src="door-open.mp4" type="video/mp4"></video></div>
<div id="welcomeStage"><div id="welcomeCrop"><video id="welcomeVideo" src="ketimelam.mp4" muted playsinline preload="metadata"></video></div></div>

<div id="eventPage">
<div class="floral-side floral-left"></div><div class="floral-side floral-right"></div><div class="petals" id="petals"></div>
