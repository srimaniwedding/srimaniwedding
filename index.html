<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Test Final</title>
<style>
body{margin:0;background:#000;overflow:hidden}
#doorVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#openBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2147483647;width:120px;height:120px;border-radius:50%;border:3px solid #fff;background:gold;font:bold 18px Arial;color:#000;cursor:pointer}
</style>
</head>
<body>
<audio id="bgm" src="sample.mp3" playsinline preload="auto"></audio>                                                       
<video id="doorVideo" muted playsinline preload="auto" poster="door-open.jpg">
  <source src="door-open.webm" type="video/webm">
  <source src="door-open.mp4" type="video/mp4">
</video>
  
<button id="openBtn" type="button" onclick="openDoor()">OPEN</button>

<script>
var bgm = document.getElementById('bgm');
var doorVideo = document.getElementById('doorVideo');
var opened = false;

bgm.loop = true; // for Chrome/Firefox
bgm.addEventListener('ended', function(){
  this.currentTime = 0;
  this.play().catch(()=>{});
});

function openDoor(){
  if(opened) return;
  opened = true;
  bgm.muted = false;
  bgm.volume = 1;
  bgm.currentTime = 0;
  bgm.play().catch(()=>{});
  
  document.getElementById('openBtn').style.display='none';
  
  doorVideo.muted = true;
  doorVideo.currentTime = 0;
  // Firefox fix - try play, if fails still continue
  var p = doorVideo.play();
  if(p) p.catch(function(e){
    console.log('door video fail', e);
    // still continue to next page after 1 sec
  });

  // ALWAYS go to next page after 4.3 sec - even if video stuck
  setTimeout(function(){
    window.location.href = '#event'; 
  }, 4300);
}

document.getElementById('openBtn').addEventListener('touchend', function(e){ e.preventDefault(); openDoor(); }, {passive:false});
</script>
</body>
</html>
